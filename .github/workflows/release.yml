name: Release

# Tag-driven: `git tag v0.1.0 && git push origin v0.1.0` builds the bundle and
# publishes it as a GitHub Release asset. Trinket vendors plotpolish by curling
# a pinned release asset and checking it with `sha256sum -c` (see
# docs/trinket-integration.md), so the .sha256 file is part of the contract,
# not a nicety. dist/ is gitignored, so the release is the only place a built
# bundle exists outside a working checkout.

on:
  push:
    # v[0-9]* rather than v*, which also matches a tag like `vendor`. That case
    # failed safe on the version check, but failing at all is noise.
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # CI's `typescript` job in the same order, plus the artifact checks below.
      # NOT run here: CI's two-version pytest matrix. That gates `main`, and a
      # tag is expected to point at a commit that already passed it — nothing
      # mechanically enforces that, so check the commit is green before tagging.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: python3 -c "import json; json.load(open('src/schema/controls.json'))"

      # `npm test` ran on a fresh checkout, where dist/ does not exist yet, so
      # src/iife.test.ts skipped itself by design (see its header comment). Run
      # it now the bundle is built: it is the only gate that actually executes
      # the artifact this workflow publishes.
      - run: npx vitest run src/iife.test.ts

      # src/iife.test.ts (run just above) compares each bundle's banner against
      # LICENSE verbatim, which is the real gate. This is the cheap one: the
      # three pieces BSD-3-Clause actually asks a redistribution to carry, so a
      # banner truncated to its identifier fails here too. Checking only for the
      # SPDX line -- which vite writes from this same repo -- proved a banner
      # existed and nothing about what was in it.
      - name: Verify the license notice survived the build
        run: |
          for f in dist/plotpolish.js dist/plotpolish.iife.js; do
            head -1 "$f" | grep -q "SPDX-License-Identifier: BSD-3-Clause" \
              || { echo "Error: SPDX identifier missing from the first line of $f"; exit 1; }
            grep -q "Copyright (c) 2026, Larry Engelhardt and plotpolish contributors" "$f" \
              || { echo "Error: copyright notice missing from $f"; exit 1; }
            grep -q "list of conditions and the following disclaimer" "$f" \
              || { echo "Error: list of conditions missing from $f"; exit 1; }
            grep -q "THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS" "$f" \
              || { echo "Error: warranty disclaimer missing from $f"; exit 1; }
          done

      - name: Verify the Python helper is inside both bundles
        run: |
          for f in dist/plotpolish.js dist/plotpolish.iife.js; do
            if ! grep -q "def introspect_figure" "$f"; then
              echo "Error: Python helper not found in $f"
              exit 1
            fi
          done

      # The tag and every version string in the tree must agree, or the released
      # asset is mislabelled and the panel reports a version it isn't.
      - name: Verify the tag matches every version string
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if [ "$2" != "$tag" ]; then
              echo "Error: $1 is $2, tag is $tag"
              fail=1
            fi
          }
          check package.json          "$(node -p "require('./package.json').version")"
          check python/pyproject.toml "$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)"
          check core.py               "$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/plotpolish/core.py | head -1)"
          check src/constants.ts      "$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' src/constants.ts | head -1)"
          [ "$fail" -eq 0 ] || exit 1
          echo "All version strings agree with $GITHUB_REF_NAME"

      - name: Checksum
        working-directory: dist
        run: sha256sum plotpolish.iife.js > plotpolish.iife.js.sha256

      # The bundle ends in `//# sourceMappingURL=plotpolish.iife.js.map`, so a
      # consumer's devtools request the map whether or not it is published.
      # Upload it rather than serving them a 404.
      #
      # Idempotent on purpose: if a run fails after the release exists, a
      # re-run would otherwise die on "already exists" and leave a draft to
      # clear up by hand.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # LICENSE travels with the asset: BSD-3-Clause clause 2 asks binary
          # redistributions to reproduce the notice, and a host that curls the
          # bundle should not have to go looking for it.
          assets="dist/plotpolish.iife.js dist/plotpolish.iife.js.sha256 dist/plotpolish.iife.js.map LICENSE"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; replacing its assets."
            gh release upload "$GITHUB_REF_NAME" --clobber $assets
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "See CHANGELOG.md for what is in this release." \
              $assets
          fi
