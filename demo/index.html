<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>plotpolish demo</title>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>plotpolish demo</h1>
      <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </header>

    <p class="note">
      Real mode (the default) downloads Pyodide and matplotlib from the jsDelivr CDN the first
      time you click Run &mdash; tens of MB, only after you confirm. Prefer to stay offline?
      Use <a id="mock-link" href="?backend=mock">?backend=mock</a> for an offline mode with no
      Python at all.
    </p>

    <main class="columns">
      <section class="col col-editor">
        <div class="col-header">
          <h2>Source</h2>
          <div class="row">
            <button id="run" type="button">Run</button>
            <span id="status" class="status" role="status" aria-live="polite"></span>
          </div>
        </div>
        <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </section>

      <section class="col col-panel">
        <div class="panel-wrap">
          <plotpolish-panel id="panel"></plotpolish-panel>
        </div>
        <div class="figure-wrap">
          <div id="figure"></div>
          <pre id="output"></pre>
        </div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
